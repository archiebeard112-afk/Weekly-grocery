name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew && ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/*.apk WeeklyMeals.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeeklyMeals-debug-apk
          path: WeeklyMeals.apk

      # A public Release lets the app download updates without a GitHub sign-in.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "build-${{ github.run_number }}" WeeklyMeals.apk \
            --title "Version 1.${{ github.run_number }}" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" --latest
